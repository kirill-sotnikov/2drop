name: 2drop

# Keep approximately 500 MB of logs per container, rotating in 100 MB files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SIGNALING_URL: wss://${APP_DOMAIN:?Set APP_DOMAIN}/ws
        NEXT_PUBLIC_ICE_TRANSPORT_POLICY: ${NEXT_PUBLIC_ICE_TRANSPORT_POLICY:-all}
    restart: unless-stopped
    logging: *logging
    init: true
    networks:
      traefik-public:
        aliases:
          - 2drop-web

  service:
    build:
      context: .
      target: service
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_VERSION: ${APP_VERSION:-unknown}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-2000}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-2000}
      ICE_SERVERS_JSON: '[{"urls":"stun:${TURN_DOMAIN:?Set TURN_DOMAIN}:3478"}]'
      TURN_URLS: turn:${TURN_DOMAIN}:3478?transport=udp,turn:${TURN_DOMAIN}:3478?transport=tcp,turns:${TURN_DOMAIN}:443?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
      TURN_TTL_SECONDS: "3600"
    networks:
      traefik-public:
        aliases:
          - 2drop-signalling

  coturn:
    image: coturn/coturn:4.18.0-r0-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: [/bin/sh, /etc/coturn/entrypoint.sh]
    environment:
      TURN_DOMAIN: ${TURN_DOMAIN:?Set TURN_DOMAIN}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP to the public IPv4 address}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
    volumes:
      - ./deploy/coturn.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/coturn-entrypoint.sh:/etc/coturn/entrypoint.sh:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49260:49160-49260/udp"
    networks:
      traefik-public:
        aliases:
          - 2drop-coturn

networks:
  traefik-public:
    external: true
